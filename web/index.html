<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BOB</title>
    <style>
      :root { color-scheme: light dark; }
      html, body { margin: 0; height: 100%; }
      body { display: flex; flex-direction: column; font-family: system-ui, sans-serif; }
      #toolbar {
        display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap;
        padding: 0.35rem 0.6rem; border-bottom: 1px solid #8884; font-size: 13px;
      }
      #toolbar label { display: inline-flex; align-items: center; gap: 0.3rem; }
      #toolbar select, #toolbar input, #toolbar button { font: inherit; padding: 0.15rem 0.35rem; }
      #app { flex: 1; min-height: 0; }
      #status { opacity: 0.7; }
    </style>
  </head>
  <body>
    <div id="toolbar">
      <label>Storage
        <select id="storage-mode">
          <option value="browser">Browser (OPFS)</option>
          <option value="desktop">Desktop (local server)</option>
        </select>
      </label>
      <input id="storage-server" placeholder="http://127.0.0.1:8795" size="22" />
      <input id="git-remote" placeholder="git remote" size="22" />
      <input id="git-branch" placeholder="branch" size="6" />
      <button id="git-sync" type="button">Sync</button>
      <span id="status">starting…</span>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
