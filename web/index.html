<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BOB</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b1224;
        --panel: #111a30;
        --card: #16203a;
        --border: #26324f;
        --fg: #dbe4f5;
        --muted: #a9b8d6;
        --accent: #6ea8fe;
      }
      html, body { margin: 0; height: 100%; }
      body {
        display: flex; flex-direction: column;
        background: var(--bg); color: var(--fg);
        font: 13px/1.4 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      #toolbar {
        display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap;
        padding: 0.45rem 0.7rem;
        background: var(--panel); color: var(--fg);
        border-bottom: 1px solid var(--border);
        font-size: 13px;
      }
      #toolbar label { display: inline-flex; align-items: center; gap: 0.35rem; color: var(--fg); }
      #toolbar select, #toolbar input, #toolbar button {
        font: inherit; font-size: 13px;
        color: var(--fg);
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 0.3rem 0.5rem;
      }
      #toolbar input::placeholder { color: var(--muted); opacity: 1; }
      #toolbar select:hover, #toolbar input:hover, #toolbar button:hover { border-color: var(--accent); }
      #toolbar select:focus-visible, #toolbar input:focus-visible, #toolbar button:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 1px;
      }
      #storage-server {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 12.5px;
        min-width: 15rem;
        letter-spacing: 0.01em;
      }
      #status { color: var(--muted); }
      #toolbar button:disabled { opacity: 0.55; cursor: default; }
      #app { flex: 1; min-height: 0; }
    </style>
  </head>
  <body>
    <div id="toolbar">
      <label>Storage
        <select id="storage-mode">
          <option value="browser">Browser (OPFS)</option>
          <option value="desktop">Desktop (local server)</option>
        </select>
      </label>
      <input id="storage-server" placeholder="http://127.0.0.1:8795" size="22" />
      <span id="ws-tools" hidden>
        <button id="ws-export" type="button" title="Download the browser workspace as a JSON archive">Export</button>
        <button id="ws-import" type="button" title="Merge a workspace archive into this browser">Import</button>
        <input id="ws-import-file" type="file" accept="application/json,.json" hidden />
        <button id="ws-reseed" type="button" hidden>Workspace update available</button>
        <button id="ws-reseed-dismiss" type="button" title="Not now" hidden>×</button>
      </span>
      <span id="status">starting…</span>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
